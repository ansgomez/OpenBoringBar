validation_scenarios:
  - id: permission_setup
    title: Permission setup flow
    required: true
    steps:
      - launch_with_missing_permissions
      - verify_setup_screen
      - grant_permissions_and_confirm_runtime

  - id: multi_display_lifecycle
    title: Multi-display bar create/remove
    required: true
    steps:
      - attach_multiple_displays
      - confirm_per_display_bar
      - disconnect_reconnect_display_and_recheck

  - id: capsule_app_switch
    title: App switch from capsule
    required: true
    steps:
      - open_multiple_apps
      - switch_using_capsules
      - verify_frontmost_app_changes

  - id: launcher_flow
    title: Launcher open/search/launch
    required: true
    steps:
      - open_launcher
      - search_application
      - launch_and_verify_focus

  - id: bottom_guard
    title: Bottom guard behavior
    required: true
    steps:
      - move_frontmost_window_to_bottom_edge
      - verify_no_unintended_overlap

  - id: pinned_apps
    title: Pinned apps pin/open/unpin and display modes
    required: true
    steps:
      - pin_running_app_from_pill_menu
      - quit_app_and_reopen_from_pin
      - reorder_from_pin_menu
      - unpin_from_pin_menu
      - pin_menu_lists_windows_from_other_workspaces_and_quits_app
      - with_aerospace_click_pin_of_app_on_other_workspace_and_verify_new_window_opens_here
      - with_aerospace_click_pin_of_app_on_this_workspace_and_verify_it_focuses_without_new_window
      - shift_click_pin_and_new_window_menu_item_open_new_window_here
      - switch_show_pins_on_modes_on_two_displays
      - relaunch_bar_and_confirm_pins_persist

  - id: off_screen_windows
    title: Windows parked off-screen by a window manager
    required: false
    steps:
      - with_aerospace_put_app_on_inactive_workspace
      - verify_no_pill_and_window_not_resized
      - toggle_hide_off_screen_windows_off_and_verify_pill_returns

  - id: aerospace_workspace_row
    title: AeroSpace workspace row
    required: false
    steps:
      - with_aerospace_verify_single_row_lists_non_empty_and_visible_workspaces
      - click_workspace_name_and_icon_and_verify_switch_and_focus
      - drag_icon_to_other_group_and_to_plus_and_verify_window_moved
      - toggle_show_workspaces_off_and_verify_only_pills_remain
      - with_pills_follow_workspace_verify_visible_group_holds_one_pill_per_window_and_click_focuses_it
      - drag_pill_onto_workspace_group_and_verify_window_moved
      - minimize_window_and_verify_icon_in_minimized_group_on_every_workspace
      - click_minimized_icon_and_verify_window_restored_on_current_workspace
      - drop_pill_on_minimized_group_and_verify_window_minimized

  - id: start_menu
    title: Start menu and workspace layouts
    required: false
    steps:
      - open_start_menu_and_verify_frequent_apps_include_all_pinned_ones
      - right_click_frequent_app_remove_it_then_restore_removed_apps
      - move_folder_widget_to_start_menu_and_back_to_bar
      - right_click_app_icon_add_to_start_menu_verify_favorites_then_remove
      - launch_unpinned_app_verify_icon_after_pins_then_close_its_window_and_quit_it
      - hover_idle_pin_stack_verify_unfold_click_icon_and_fold_on_leave
      - open_app_from_all_applications_and_browse_applications_folder
      - on_empty_workspace_run_terminal_finder_preview_layout_and_verify_arrangement
      - toggle_show_empty_workspaces_and_verify_row_and_plus_target

  - id: system_stats_widgets
    title: System stats widgets
    required: false
    steps:
      - verify_cpu_memory_battery_disk_values_against_activity_monitor_and_pmset
      - click_each_widget_and_verify_target_opens
      - toggle_show_system_stats_off_and_on

  - id: folder_widgets
    title: Folder widgets
    required: false
    steps:
      - first_launch_imports_folder_peek_folders_or_downloads
      - click_folder_open_file_option_click_reveals_browse_submenu
      - add_remove_folder_and_change_sort_order_via_right_click

