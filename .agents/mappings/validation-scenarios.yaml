validation_scenarios:
  - id: permission_setup
    title: Permission setup flow
    required: true
    steps:
      - launch_with_missing_permissions
      - verify_setup_screen
      - grant_permissions_and_confirm_runtime

  - id: multi_display_lifecycle
    title: Multi-display bar create/remove
    required: true
    steps:
      - attach_multiple_displays
      - confirm_per_display_bar
      - disconnect_reconnect_display_and_recheck

  - id: capsule_app_switch
    title: App switch from capsule
    required: true
    steps:
      - open_multiple_apps
      - switch_using_capsules
      - verify_frontmost_app_changes

  - id: launcher_flow
    title: Launcher open/search/launch
    required: true
    steps:
      - open_launcher
      - search_application
      - launch_and_verify_focus

  - id: bottom_guard
    title: Bottom guard behavior
    required: true
    steps:
      - move_frontmost_window_to_bottom_edge
      - verify_no_unintended_overlap

  - id: pinned_apps
    title: Pinned apps pin/open/unpin and display modes
    required: true
    steps:
      - pin_running_app_from_pill_menu
      - quit_app_and_reopen_from_pin
      - reorder_from_pin_menu
      - unpin_from_pin_menu
      - switch_show_pins_on_modes_on_two_displays
      - relaunch_bar_and_confirm_pins_persist

  - id: off_screen_windows
    title: Windows parked off-screen by a window manager
    required: false
    steps:
      - with_aerospace_put_app_on_inactive_workspace
      - verify_no_pill_and_window_not_resized
      - toggle_hide_off_screen_windows_off_and_verify_pill_returns
